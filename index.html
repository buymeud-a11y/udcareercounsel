<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Counseling</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto p-6 mt-10 bg-white shadow-xl rounded-2xl">
        <h1 class="text-3xl font-bold text-center text-blue-700 mb-2">Privacy-First AI Career Counseling</h1>
        <p class="text-center text-gray-500 mb-8">No personal data stored. Real-time insights powered by AI.</p>
        
        <div id="app-container">
            <!-- Step 1: Profile -->
            <div id="step-profile" class="space-y-4">
                <h2 class="text-xl font-semibold">1. Select Your Background</h2>
                <select id="stream" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                    <option value="">Select your 12th Stream...</option>
                    <option value="PCM">Science (PCM)</option>
                    <option value="PCB">Science (PCB)</option>
                    <option value="Commerce">Commerce</option>
                    <option value="Arts">Arts/Humanities</option>
                </select>
                <button onclick="startTest()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold transition">Start Aptitude Test</button>
            </div>

            <!-- Step 2: Test -->
            <div id="step-test" class="hidden space-y-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold">Aptitude Assessment</h2>
                    <span id="question-tracker" class="text-sm font-bold text-gray-500 bg-gray-100 px-3 py-1 rounded-full"></span>
                </div>
                <div id="question-container" class="p-6 bg-blue-50 rounded-xl text-lg font-medium shadow-inner"></div>
                <div id="options-container" class="grid grid-cols-1 gap-3"></div>
            </div>

            <!-- Step 3: Results -->
            <div id="step-results" class="hidden space-y-4">
                <div id="loading" class="text-center py-10 hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700 mx-auto mb-4"></div>
                    <p class="text-lg font-semibold animate-pulse text-blue-800">Analyzing profile & generating custom roadmap...</p>
                </div>
                <div id="report-content" class="prose max-w-none text-gray-700"></div>
                <div class="mt-6 flex gap-4">
                    <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg hidden shadow" id="print-btn">Print / Download PDF</button>
                    <button onclick="location.reload()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hidden" id="reset-btn">Start Over</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
